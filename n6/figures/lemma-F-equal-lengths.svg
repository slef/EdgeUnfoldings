   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b49" x="459.050811" y="74.23488" transform="rotate(-0 459.050811 74.23488)">A crossing would require</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b82f4b" x="459.050811" y="109.07136" transform="rotate(-0 459.050811 109.07136)">2θ + 2δ + κₐ &lt; 180°</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b49" x="459.050811" y="153.86112" transform="rotate(-0 459.050811 153.86112)">But if every curvature is ≤180°:</text>
   </g>
   <g id="text_12">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24775d" x="459.050811" y="193.67424" transform="rotate(-0 459.050811 193.67424)">2θ + 2δ + κₐ &gt; 180°</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(459.050811 240.071032)">The two equal edge lengths give the first bound.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(459.050811 257.121032)">The total curvature and a face-angle bound</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(459.050811 274.171033)">give the second. Both cannot hold.</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b49" x="39.6" y="25.9815" transform="rotate(-0 39.6 25.9815)">The missing distance argument: equal cut edges forbid entry</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4d6372" x="39.6" y="333.504" transform="rotate(-0 39.6 333.504)">Proof schematic only. The displayed planar crossing cannot satisfy the low-curvature octahedron hypotheses.</text>
