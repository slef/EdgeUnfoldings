<svg xmlns="http://www.w3.org/2000/svg" width="860" height="690" viewBox="0 0 860 690" role="img" aria-labelledby="title desc">
<title id="title">The same triangular chain inside two prism unfoldings</title>
<desc id="desc">Remove four leaf triangles from the reference shortest-path star, or the two quadrilaterals from the original-edge fallback. Both leave the chain A, C, E, F with hinges 01, 13, 34. Hence the triangular caps A and F are disjoint in the fallback.</desc>
<rect width="860" height="690" rx="14" fill="#f7fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#253e4b}.title{font-size:23px;font-weight:bold}.subtitle{font-size:17px}.face{font-size:21px;font-weight:bold}.edge{font-size:16px;fill:#4a6775}.note{font-size:17px}</style>
<text x="35" y="36" class="title" text-anchor="start">Why the triangular caps never meet</text>
<text x="35" y="66" class="subtitle" text-anchor="start">A face-tree comparison: each line is an uncut hinge, not a drawn polyhedron edge.</text>
<text x="35" y="108" class="title" text-anchor="start">1. Reference shortest-path star at vertex 2</text>
<path d="M141 222L269 222" stroke="#367b62" stroke-width="4"/>
<text x="205.0" y="214.0" class="edge" text-anchor="middle">01</text>
<path d="M361 222L489 222" stroke="#367b62" stroke-width="4"/>
<text x="425.0" y="214.0" class="edge" text-anchor="middle">13</text>
<path d="M581 222L709 222" stroke="#367b62" stroke-width="4"/>
<text x="645.0" y="214.0" class="edge" text-anchor="middle">34</text>
<rect x="49" y="199" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="95" y="229" class="face" text-anchor="middle">A</text>
<rect x="269" y="199" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="315" y="229" class="face" text-anchor="middle">C</text>
<rect x="489" y="199" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="535" y="229" class="face" text-anchor="middle">E</text>
<rect x="709" y="199" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="755" y="229" class="face" text-anchor="middle">F</text>
<path d="M315 199L315 176" stroke="#98aab4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="334.0" y="193.5" class="edge" text-anchor="middle">03</text>
<rect x="269" y="130" width="92" height="46" rx="8" fill="#d6e9f3" stroke="#a6b4bc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="315" y="160" class="face" text-anchor="middle">B₁</text>
<path d="M535 199L535 176" stroke="#98aab4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="554.0" y="193.5" class="edge" text-anchor="middle">14</text>
<rect x="489" y="130" width="92" height="46" rx="8" fill="#f2ddc4" stroke="#a6b4bc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="535" y="160" class="face" text-anchor="middle">D₁</text>
<path d="M755 199L755 176" stroke="#98aab4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="774.0" y="193.5" class="edge" text-anchor="middle">35</text>
<rect x="709" y="130" width="92" height="46" rx="8" fill="#d6e9f3" stroke="#a6b4bc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="755" y="160" class="face" text-anchor="middle">B₂</text>
<path d="M755 245L755 269" stroke="#98aab4" stroke-width="2" stroke-dasharray="5 5"/>
<text x="774.0" y="263.0" class="edge" text-anchor="middle">45</text>
<rect x="709" y="269" width="92" height="46" rx="8" fill="#f2ddc4" stroke="#a6b4bc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="755" y="299" class="face" text-anchor="middle">D₂</text>
<text x="35" y="285" class="note" text-anchor="start">B is split along 23; D is split along 24.</text>
<text x="35" y="311" class="note" text-anchor="start">Delete the four dashed leaf pieces.</text>
<path d="M35 340H825" stroke="#cfdae0"/>
<text x="35" y="379" class="title" text-anchor="start">2. The original-edge fallback tree</text>
<path d="M141 503L269 503" stroke="#367b62" stroke-width="4"/>
<text x="205.0" y="495.0" class="edge" text-anchor="middle">01</text>
<path d="M361 503L489 503" stroke="#367b62" stroke-width="4"/>
<text x="425.0" y="495.0" class="edge" text-anchor="middle">13</text>
<path d="M581 503L709 503" stroke="#367b62" stroke-width="4"/>
<text x="645.0" y="495.0" class="edge" text-anchor="middle">34</text>
<rect x="49" y="480" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="95" y="510" class="face" text-anchor="middle">A</text>
<rect x="269" y="480" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="315" y="510" class="face" text-anchor="middle">C</text>
<rect x="489" y="480" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="535" y="510" class="face" text-anchor="middle">E</text>
<rect x="709" y="480" width="92" height="46" rx="8" fill="#edf2ef" stroke="#496774" stroke-width="1.5"/>
<text x="755" y="510" class="face" text-anchor="middle">F</text>
<path d="M315 480L315 460" stroke="#367b62" stroke-width="4"/>
<text x="334.0" y="476.0" class="edge" text-anchor="middle">03</text>
<rect x="269" y="414" width="92" height="46" rx="8" fill="#b5d7e8" stroke="#496774" stroke-width="1.5"/>
<text x="315" y="444" class="face" text-anchor="middle">B</text>
<path d="M535 480L535 460" stroke="#367b62" stroke-width="4"/>
<text x="554.0" y="476.0" class="edge" text-anchor="middle">14</text>
<rect x="489" y="414" width="92" height="46" rx="8" fill="#ebc392" stroke="#496774" stroke-width="1.5"/>
<text x="535" y="444" class="face" text-anchor="middle">D</text>
<text x="35" y="555" class="note" text-anchor="start">Delete the two whole quadrilaterals: the same A–C–E–F chain remains.</text>
<rect x="35" y="584" width="790" height="76" rx="10" fill="#e3eee8"/>
<text x="55" y="614" class="note" text-anchor="start">The chain inherits nonoverlap from the known star unfolding.</text>
<text x="55" y="642" class="note" text-anchor="start">Fourteen of fifteen pairs are safe. Only quadrilateral B versus D remains.</text>
</svg>
